  <!-- arrows -->
  <path d="M480 464H578" stroke="url(#arrow)" stroke-width="10" stroke-linecap="round"/>
  <path d="M552 434L582 464L552 494" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1010 464H1108" stroke="url(#arrow)" stroke-width="10" stroke-linecap="round"/>
  <path d="M1082 434L1112 464L1082 494" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="80" y="760" width="1440" height="56" rx="18" fill="#0F172A"/>
  <text x="112" y="796" fill="#DBEAFE" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="650">
