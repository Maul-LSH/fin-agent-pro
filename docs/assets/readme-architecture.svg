  <path d="M360 360H455" stroke="url(#b)" stroke-width="8" stroke-linecap="round"/>
  <path d="M438 338L460 360L438 382" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

